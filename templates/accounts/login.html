{% extends 'base.html' %}

{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

<div class="auth-card">

<h2 class="text-center mb-4">

Welcome Back

</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button class="btn btn-primary w-100">

Login

</button>

<div class="text-center mt-3">

Don't have an account?

<a href="{% url 'register' %}">

Register

</a>

</div>

</form>

</div>

</div>

{% endblock %}
