{% extends 'base.html' %}

{% block title %}
Verify OTP
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4">

                <h3 class="text-center mb-4">

                    Email Verification

                </h3>

                <form method="POST">

                    {% csrf_token %}

                    <input
                        type="text"
                        name="otp"
                        class="form-control mb-3"
                        placeholder="Enter OTP">

                    <button class="btn btn-primary w-100">

                        Verify OTP

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
