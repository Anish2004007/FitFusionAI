{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}

<div class="auth-container">

<div class="auth-card">

<h2 class="text-center mb-4">

Create New Password

</h2>

{% if messages %}
{% for message in messages %}
<div class="alert alert-{{ message.tags }}">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>New Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<button type="submit" class="auth-btn">
    Reset Password
</button>

</form>

</div>

</div>

{% endblock %}
